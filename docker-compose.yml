name: memory-vault

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: vault
      POSTGRES_DB: vault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm secrets:init}
      VAULT_APP_DB_PASSWORD: ${VAULT_APP_DB_PASSWORD:?run pnpm secrets:init}
    ports:
      - '127.0.0.1:${VAULT_PG_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vault -d vault']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?run pnpm secrets:init}
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
    ports:
      - '127.0.0.1:${VAULT_REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  s3-test:
    image: versity/versitygw:v1.11.0
    profiles: [test]
    command: ['posix', '--versioning-dir', '/versions', '/data']
    environment:
      ROOT_ACCESS_KEY: test-access-key
      ROOT_SECRET_KEY: test-secret-key
      VGW_PORT: ':7070'
    ports:
      - '127.0.0.1:7070:7070'
    tmpfs:
      - /data
      - /versions

volumes:
  pgdata:
  redisdata:
