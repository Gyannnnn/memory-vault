name: memory-vault

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: vault
      POSTGRES_DB: vault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm secrets:init}
      VAULT_APP_DB_PASSWORD: ${VAULT_APP_DB_PASSWORD:?run pnpm secrets:init}
    ports:
      - '127.0.0.1:${VAULT_PG_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vault -d vault']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?run pnpm secrets:init}
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
    ports:
      - '127.0.0.1:${VAULT_REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: memory-vault-api:local
    profiles: [app]
    command: ['pnpm', 'exec', 'tsx', 'src/server.ts']
    restart: unless-stopped
    env_file: apps/api/.env
    environment: &app-environment
      NODE_ENV: production
      DATABASE_URL: postgresql://vault_app:${VAULT_APP_DB_PASSWORD}@postgres:5432/vault
      DATABASE_MIGRATE_URL: postgresql://vault:${POSTGRES_PASSWORD}@postgres:5432/vault
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - '127.0.0.1:${VAULT_API_PORT:-4000}:4000'
    depends_on: &app-depends
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: memory-vault-api:local
    profiles: [app]
    restart: unless-stopped
    env_file: apps/api/.env
    environment:
      <<: *app-environment
      INGEST_CONCURRENCY: '2'
    volumes:
      - ${VAULT_LAPTOP_SOURCE_DIR:-./docker/empty}:/mnt/sources/laptop:ro
      - ${VAULT_STAGING_DIR:-./docker/empty}:/mnt/sources/staging:ro
    depends_on: *app-depends

  ml:
    build:
      context: services/face-worker
    image: memory-vault-ml:local
    profiles: [app]
    restart: unless-stopped
    environment:
      CLIP_REPO: Xenova/clip-vit-base-patch32
      CLIP_REVISION: 6b7c523703ae26e39be4b03774966f8571c7f523
      MODEL_DIR: /models
      ALLOWED_ROOTS: /mnt/sources
    ports:
      - '127.0.0.1:${VAULT_ML_PORT:-8090}:8090'
    volumes:
      - models:/models
      - ${VAULT_LAPTOP_SOURCE_DIR:-./docker/empty}:/mnt/sources/laptop:ro
      - ${VAULT_STAGING_DIR:-./docker/empty}:/mnt/sources/staging:ro

  s3-test:
    image: versity/versitygw:v1.11.0
    profiles: [test]
    command: ['posix', '--versioning-dir', '/versions', '/data']
    environment:
      ROOT_ACCESS_KEY: test-access-key
      ROOT_SECRET_KEY: test-secret-key
      VGW_PORT: ':7070'
      VGW_REGION: ap-south-1
    ports:
      - '127.0.0.1:7070:7070'
    tmpfs:
      - /data
      - /versions

volumes:
  pgdata:
  redisdata:
  models:
